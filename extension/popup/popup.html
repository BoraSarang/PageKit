<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>PageKit</title>
  </head>
  <body>
    <header class="pk-header">
      <img src="../icons/icon32.png" alt="PageKit" class="pk-logo" />
      <h1>PageKit</h1>
      <span class="pk-badge" id="pk-dl-badge" hidden>0</span>
    </header>

    <main class="pk-main">
      <div class="pk-action">
        <button id="pk-panel-media" class="pk-btn pk-btn-primary">📊 사이드 패널에서 분석</button>
        <p class="pk-hint">
          페이지의 이미지·영상·링크, 스트림 등을 추출해 사이드 패널에서 확인합니다.
        </p>
      </div>
      <div class="pk-action">
        <button id="pk-panel-quality" class="pk-btn pk-btn-secondary">
          ✅ 사이드 패널에서 품질 진단
        </button>
        <p class="pk-hint">페이지 콘텐츠 품질을 항목별로 진단하고 개선 제안을 확인합니다.</p>
      </div>

      <section class="pk-section" id="pk-dl-section" hidden>
        <h2>📥 다운로드 중</h2>
        <div id="pk-dl-list"></div>
      </section>
    </main>

    <footer class="pk-footer">
      <span id="pk-version" class="pk-version"></span>
      <a href="#" id="pk-open-options">설정</a>
    </footer>

    <script src="../debug.js"></script>
    <script type="module" src="popup.js?v=1"></script>
  </body>
</html>
