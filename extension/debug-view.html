<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PageKit 디버그</title>
  <link rel="stylesheet" href="debug-view.css">
</head>
<body>
  <div id="statusBar" class="d-status d-status-off" hidden>
    <span>⚠️ 디버그 로그 수집이 꺼져 있습니다 — 아래 버튼으로 켜면 로그가 쌓이기 시작합니다.</span>
    <button id="enableBtn" class="d-btn">로그 수집 켜기</button>
  </div>

  <header class="d-head">
    <h1>PageKit 디버그 로그</h1>
    <div class="d-head-right">
      <span class="d-hint">단축키 Ctrl/Cmd+Shift+D로 열고 닫기 · 닫기 전까지 계속 누적</span>
      <button id="pauseBtn" class="d-btn">일시정지</button>
      <button id="copyBtn" class="d-btn">전체 복사</button>
      <button id="clearBtn" class="d-btn d-danger">지우기</button>
    </div>
  </header>

  <div class="d-filters">
    <label>레벨
      <select id="fLevel">
        <option value="">전체</option>
        <option value="ERROR">ERROR</option>
        <option value="WARN">WARN</option>
        <option value="PERF">PERF</option>
        <option value="CACHE">CACHE</option>
        <option value="FEATURE">FEATURE</option>
        <option value="INFO">INFO</option>
        <option value="DEBUG">DEBUG</option>
      </select>
    </label>
    <label>탭
      <select id="fTab"><option value="">전체</option></select>
    </label>
    <label class="d-search"><span class="d-search-label">검색</span>
      <input id="fText" type="text" placeholder="URL/텍스트">
    </label>
  </div>

  <pre id="log" class="d-log"></pre>

  <footer class="d-foot"><span id="count"></span></footer>

  <script src="debug.js"></script>
  <script src="debug-view.js"></script>
</body>
</html>
