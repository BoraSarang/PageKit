<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageKit 품질 진단</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f8fafc; --fg: #1e293b; --card: #fff; --muted: #64748b;
      --primary: #0d9488; --primary-hover: #0f766e;
      --accent: #ea580c; --accent-hover: #c2410c;
      --border: #e2e8f0; --ring: #0d9488;
      --red: #dc2626; --orange: #d97706; --green: #059669; --blue: #3b82f6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --fg: #f1f5f9; --card: #1e293b; --muted: #94a3b8; --border: #334155; --ring: #14b8a6; }
    }
    * { margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); font-size: 13px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--card); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 15px; font-weight: 600; flex: 1; }
    .btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s, color 0.15s; }
    .btn-primary { background: var(--primary); color: #fff; } .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--border); color: var(--fg); } .btn-secondary:hover { background: #cbd5e1; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    main { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; }
    .score-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start; }
    .score-main { text-align: center; }
    .score-value { font-size: 48px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
    .score-excellent { color: #059669; } .score-good { color: #0d9488; } .score-fair { color: #d97706; } .score-poor { color: #dc2626; }
    .score-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .sub-scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .sub-score { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .sub-score .val { font-size: 20px; font-weight: 700; } .sub-score .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .controls { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .control-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .control-row:last-child { margin-bottom: 0; }
    .check-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
    .check-item input { width: 14px; height: 14px; accent-color: var(--primary); }
    .check-item.disabled { opacity: 0.5; pointer-events: none; }

    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .chart-title { font-weight: 600; margin-bottom: 12px; font-size: 13px; }
    .gauge { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .gauge svg { width: 120px; height: 120px; transform: rotate(-90deg); }
    .gauge-bg { fill: none; stroke: var(--border); stroke-width: 8; }
    .gauge-progress { fill: none; stroke: var(--primary); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
    .gauge-value { font-size: 24px; font-weight: 700; color: var(--primary); }
    .gauge-label { font-size: 11px; color: var(--muted); text-align: center; }
    .waterfall { display: flex; flex-direction: column; gap: 6px; }
    .waterfall-item { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .waterfall-bar { height: 6px; border-radius: 3px; background: var(--primary); flex: 1; max-width: 120px; }
    .waterfall-info { display: flex; flex-direction: column; gap: 2px; min-width: 80px; }
    .waterfall-url { font-family: monospace; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .waterfall-time { font-size: 10px; font-weight: 600; color: var(--primary); }

    .issues { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; max-height: 400px; overflow-y: auto; }
    .issues-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .issues-title { font-weight: 600; font-size: 13px; }
    .issue-count { font-size: 11px; color: var(--muted); }
    .issue-list { display: flex; flex-direction: column; gap: 8px; }
    .issue { padding: 10px 12px; border-radius: 8px; border-left: 3px solid; font-size: 12px; }
    .issue-critical { background: #fef2f2; border-color: #dc2626; }
    .issue-major { background: #fffbeb; border-color: #d97706; }
    .issue-minor { background: #f0fdfa; border-color: #0d9488; }
    .issue-info { background: #eff6ff; border-color: #3b82f6; }
    .issue-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .issue-sev { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
    .sev-critical { background: #dc2626; color: #fff; }
    .sev-major { background: #d97706; color: #fff; }
    .sev-minor { background: #0d9488; color: #fff; }
    .sev-info { background: #3b82f6; color: #fff; }
    .issue-module { font-size: 10px; color: var(--muted); background: var(--bg); padding: 1px 6px; border-radius: 4px; }
    .issue-loc { font-family: monospace; font-size: 10px; color: var(--muted); margin-left: auto; }
    .issue-msg { font-weight: 500; margin-bottom: 2px; }
    .issue-fix { font-size: 11px; color: var(--muted); }
    .no-issues { text-align: center; padding: 24px; color: var(--muted); }
    .no-issues svg { width: 48px; height: 48px; margin-bottom: 8px; stroke: var(--green); }

    .export-bar { display: flex; gap: 8px; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 16px; }
    @media (max-width: 600px) { .charts { grid-template-columns: 1fr; } .sub-scores { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <h1>🔍 품질 진단</h1>
    <button id="btn-analyze" class="btn btn-primary">분석 시작</button>
  </header>
  <main>
    <section class="score-card" id="score-card" style="display:none;">
      <div class="score-main">
        <div id="overall-score" class="score-value score-poor">--</div>
        <div class="score-label">전체 점수 (100점 만점)</div>
      </div>
      <div class="sub-scores" id="sub-scores">
        <div class="sub-score"><div id="score-seo" class="val">--</div><div class="lbl">SEO</div></div>
        <div class="sub-score"><div id="score-perf" class="val">--</div><div class="lbl">성능</div></div>
        <div class="sub-score"><div id="score-a11y" class="val">--</div><div class="lbl">접근성</div></div>
        <div class="sub-score"><div id="score-bp" class="val">--</div><div class="lbl">모범 사례</div></div>
      </div>
    </section>

    <section class="controls">
      <div class="control-row">
        <strong style="font-size:13px;">분석 모듈</strong>
        <span style="flex:1;"></span>
        <button id="btn-check-all" class="btn btn-secondary" style="font-size:11px;padding:4px 8px;">전체 선택</button>
        <button id="btn-uncheck-all" class="btn btn-secondary" style="font-size:11px;padding:4px 8px;">전체 해제</button>
      </div>
      <div class="check-group" id="module-checks"></div>
      <div class="control-row" style="margin-top:12px;">
        <button id="btn-analyze" class="btn btn-primary" style="flex:1;">분석 시작</button>
        <button id="btn-export-json" class="btn btn-secondary">JSON 내보내기</button>
        <button id="btn-export-html" class="btn btn-secondary">HTML 리포트</button>
      </div>
    </section>

    <section class="charts" id="charts-section" style="display:none;">
      <div class="chart-box">
        <div class="chart-title">Core Web Vitals</div>
        <div class="gauge" id="gauge-lcp"><div class="gauge-label">LCP</div><svg viewBox="0 0 100 100"><circle class="gauge-bg" cx="50" cy="50" r="42"></circle><circle id="gauge-lcp-progress" class="gauge-progress" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle></svg><div id="gauge-lcp-val" class="gauge-value">--</div><div class="gauge-label">ms</div></div>
        <div class="gauge" id="gauge-inp"><div class="gauge-label">INP</div><svg viewBox="0 0 100 100"><circle class="gauge-bg" cx="50" cy="50" r="42"></circle><circle id="gauge-inp-progress" class="gauge-progress" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle></svg><div id="gauge-inp-val" class="gauge-value">--</div><div class="gauge-label">ms</div></div>
        <div class="gauge" id="gauge-cls"><div class="gauge-label">CLS</div><svg viewBox="0 0 100 100"><circle class="gauge-bg" cx="50" cy="50" r="42"></circle><circle id="gauge-cls-progress" class="gauge-progress" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle></svg><div id="gauge-cls-val" class="gauge-value">--</div></div>
      </div>
      <div class="chart-box">
        <div class="chart-title">리소스 폭포수 (Top 5 느린 리소스)</div>
        <div class="waterfall" id="waterfall"></div>
      </div>
    </section>

    <section class="issues" id="issues-section" style="display:none;">
      <div class="issues-header">
        <span class="issues-title">이슈 리스트</span>
        <span id="issue-count" class="issue-count">0개</span>
      </div>
      <div class="issue-list" id="issue-list"></div>
    </section>

    <div class="export-bar" id="export-bar" style="display:none;">
      <button id="btn-export-json" class="btn btn-secondary">JSON 내보내기</button>
      <button id="btn-export-html" class="btn btn-secondary">HTML 리포트</button>
      <a id="btn-open-settings" class="btn btn-secondary" href="#" target="_blank">설정 열기</a>
    </div>
  </main>
  <script src="../debug.js"></script>
  <script type="module" src="quality-tab.js"></script>
</body>
</html>
