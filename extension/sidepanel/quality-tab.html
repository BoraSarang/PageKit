<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageKit 품질 진단</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc; --fg: #1e293b; --card: #fff; --muted: #64748b;
      --primary: #0d9488; --primary-hover: #0f766e;
      --accent: #ea580c; --accent-hover: #c2410c;
      --border: #e2e8f0; --ring: #0d9488;
      --red: #dc2626; --orange: #d97706; --green: #059669; --blue: #3b82f6;
      --r-sm: 5px; --r-md: 7px; --r-lg: 9px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --fg: #f1f5f9; --card: #1e293b; --muted: #94a3b8; --border: #334155; --ring: #14b8a6; }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); font-size: 12px; line-height: 1.45; min-height: 100vh; display: flex; flex-direction: column; }

    /* 헤더 */
    header { padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--card); display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 버튼 */
    .btn { padding: 5px 10px; border-radius: var(--r-sm); font-size: 11px; font-weight: 500; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: background 0.15s, color 0.15s; white-space: nowrap; }
    .btn-primary { background: var(--primary); color: #fff; } .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--border); color: var(--fg); } .btn-secondary:hover { background: #cbd5e1; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    main { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    main > section, main > .export-bar { flex: none; }

    /* 점수 카드 — 좁음: 세로 스택 / 넓음(min-width 430px): 좌우 배치 */
    .score-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .score-main { text-align: center; }
    .score-value { font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 2px; }
    .score-excellent { color: #059669; } .score-good { color: #0d9488; } .score-fair { color: #d97706; } .score-poor { color: #dc2626; }
    .score-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .sub-scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .sub-score { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md); padding: 6px 4px; text-align: center; min-width: 0; }
    .sub-score .val { font-size: 15px; font-weight: 700; } .sub-score .lbl { font-size: 9px; color: var(--muted); margin-top: 1px; white-space: nowrap; }

    /* 분석 모듈 컨트롤 */
    .controls { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 10px; }
    .control-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .check-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 4px 8px; margin-top: 8px; }
    .check-item { display: flex; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; min-width: 0; }
    .check-item span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .check-item input { width: 13px; height: 13px; accent-color: var(--primary); flex: none; }
    .check-item.disabled { opacity: 0.5; pointer-events: none; }

    /* 차트 — 좁음: 1열 / 넓음: 2열, 게이지 3렬 */
    .charts { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 10px; min-width: 0; }
    .chart-title { font-weight: 600; margin-bottom: 8px; font-size: 12px; }
    .gauge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; justify-items: center; }
    .gauge { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .gauge svg { width: 58px; height: 58px; transform: rotate(-90deg); }
    .gauge-bg { fill: none; stroke: var(--border); stroke-width: 10; }
    .gauge-progress { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
    .gauge-value { font-size: 13px; font-weight: 700; color: var(--primary); }
    .gauge-label { font-size: 9px; color: var(--muted); text-align: center; }
    .waterfall { display: flex; flex-direction: column; gap: 5px; }
    .waterfall-item { display: flex; align-items: center; gap: 6px; font-size: 10px; }
    .waterfall-bar { height: 5px; border-radius: 3px; background: var(--primary); flex: 1; max-width: 110px; }
    .waterfall-info { display: flex; flex-direction: column; gap: 1px; min-width: 70px; }
    .waterfall-url { font-family: monospace; font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .waterfall-time { font-size: 9px; font-weight: 600; color: var(--primary); }

    /* 이슈 리스트 */
    .issues { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 10px; max-height: 300px; overflow-y: auto; }
    .issues-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .issues-title { font-weight: 600; font-size: 12px; }
    .issue-count { font-size: 10px; color: var(--muted); }
    .issue-list { display: flex; flex-direction: column; gap: 6px; }
    .issue { padding: 7px 9px; border-radius: var(--r-md); border-left: 3px solid; font-size: 11px; }
    .issue-critical { background: #fef2f2; border-color: #dc2626; }
    .issue-major { background: #fffbeb; border-color: #d97706; }
    .issue-minor { background: #f0fdfa; border-color: #0d9488; }
    .issue-info { background: #eff6ff; border-color: #3b82f6; }
    .issue-header { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
    .issue-sev { font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; }
    .sev-critical { background: #dc2626; color: #fff; }
    .sev-major { background: #d97706; color: #fff; }
    .sev-minor { background: #0d9488; color: #fff; }
    .sev-info { background: #3b82f6; color: #fff; }
    .issue-module { font-size: 9px; color: var(--muted); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
    .issue-loc { font-family: monospace; font-size: 9px; color: var(--muted); margin-left: auto; }
    .issue-msg { font-weight: 500; margin-bottom: 2px; }
    .issue-fix { font-size: 10px; color: var(--muted); }
    .no-issues { text-align: center; padding: 18px; color: var(--muted); }
    .no-issues svg { width: 40px; height: 40px; margin-bottom: 6px; stroke: var(--green); }

    .export-bar { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--border); }
    .export-bar .btn { flex: 1; }

    /* 넓은 패널(≈430px 이상): 그리드 복원 */
    @media (min-width: 430px) {
      .score-card { flex-direction: row; align-items: center; gap: 14px; }
      .score-main { flex: 0 0 auto; }
      .sub-scores { flex: 1; grid-template-columns: repeat(2, 1fr); }
      .sub-score .val { font-size: 17px; }
      .charts { grid-template-columns: 1fr 1fr; }
      .gauge svg { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🔍 품질 진단</h1>
    <button id="btn-analyze" class="btn btn-primary">분석 시작</button>
  </header>
  <main>
    <section class="score-card" id="score-card" style="display:none;">
      <div class="score-main">
        <div id="overall-score" class="score-value score-poor">--</div>
        <div class="score-label">전체 점수 (100점 만점)</div>
      </div>
      <div class="sub-scores" id="sub-scores">
        <div class="sub-score"><div id="score-seo" class="val">--</div><div class="lbl">SEO</div></div>
        <div class="sub-score"><div id="score-perf" class="val">--</div><div class="lbl">성능</div></div>
        <div class="sub-score"><div id="score-a11y" class="val">--</div><div class="lbl">접근성</div></div>
        <div class="sub-score"><div id="score-bp" class="val">--</div><div class="lbl">모범 사례</div></div>
      </div>
    </section>

    <section class="controls">
      <div class="control-row">
        <strong style="font-size:12px;">분석 모듈</strong>
        <span style="flex:1;"></span>
        <button id="btn-check-all" class="btn btn-secondary">전체 선택</button>
        <button id="btn-uncheck-all" class="btn btn-secondary">전체 해제</button>
      </div>
      <div class="check-group" id="module-checks"></div>
    </section>

    <section class="charts" id="charts-section" style="display:none;">
      <div class="chart-box">
        <div class="chart-title">Core Web Vitals</div>
        <div class="gauge-grid">
          <div class="gauge" id="gauge-lcp"><div class="gauge-label">LCP</div><svg viewBox="0 0 100 100"><circle class="gauge-bg" cx="50" cy="50" r="42"></circle><circle id="gauge-lcp-progress" class="gauge-progress" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle></svg><div id="gauge-lcp-val" class="gauge-value">--</div><div class="gauge-label">ms</div></div>
          <div class="gauge" id="gauge-inp"><div class="gauge-label">INP</div><svg viewBox="0 0 100 100"><circle class="gauge-bg" cx="50" cy="50" r="42"></circle><circle id="gauge-inp-progress" class="gauge-progress" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle></svg><div id="gauge-inp-val" class="gauge-value">--</div><div class="gauge-label">ms</div></div>
          <div class="gauge" id="gauge-cls"><div class="gauge-label">CLS</div><svg viewBox="0 0 100 100"><circle class="gauge-bg" cx="50" cy="50" r="42"></circle><circle id="gauge-cls-progress" class="gauge-progress" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle></svg><div id="gauge-cls-val" class="gauge-value">--</div></div>
        </div>
      </div>
      <div class="chart-box">
        <div class="chart-title">리소스 폭포수 (Top 5 느린 리소스)</div>
        <div class="waterfall" id="waterfall"></div>
      </div>
    </section>

    <section class="issues" id="issues-section" style="display:none;">
      <div class="issues-header">
        <span class="issues-title">이슈 리스트</span>
        <span id="issue-count" class="issue-count">0개</span>
      </div>
      <div class="issue-list" id="issue-list"></div>
    </section>

    <div class="export-bar" id="export-bar" style="display:none;">
      <button id="btn-export-json" class="btn btn-secondary">JSON 내보내기</button>
      <button id="btn-export-html" class="btn btn-secondary">HTML 리포트</button>
      <a id="btn-open-settings" class="btn btn-secondary" href="#" target="_blank">설정 열기</a>
    </div>
  </main>
  <script src="../debug.js"></script>
  <script type="module" src="quality-tab.js"></script>
</body>
</html>
